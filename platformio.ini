; PlatformIO configuration — MQuickJS for Xteink X4
;
; Alternative to the ESP-IDF CMake build.
; Install PlatformIO: https://platformio.org/
; Build: pio run
; Flash: pio run --target upload

[env:xteink_x4]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = espidf

; Treat xteink/ as the source root
build_src_dir = xteink

; Include the MQuickJS engine sources from the repo root
build_src_filter =
    +<*.c>
    +<main/*.c>
    +<../*.c>
    -<../mqjs.c>
    -<../readline*.c>
    -<../tests/*>
    -<../mquickjs_build.c>
    -<../example*.c>
    -<../mqjs_stdlib.c>

; Include paths
build_flags =
    -I .
    -I xteink
    -Wall
    -Os
    -fno-math-errno
    -fno-trapping-math
    -DCONFIG_SMALL=1

; Pre-built xteink_stdlib.h must exist (run `make xteink_stdlib.h` first)
extra_scripts = pre:platformio_pre.py

[platformio]
description = MQuickJS for Xteink X4 — JavaScript app runtime for the e-ink reader
